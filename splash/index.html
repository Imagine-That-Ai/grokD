<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>grok"D" · Cinematic Splash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Inter:wght@800;900&display=swap" rel="stylesheet">
  <style>
    /* ==========================================
       grokD Splash Design Tokens & Theme Engine
       ========================================== */
    :root {
      --font-grok: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Helvetica Neue", sans-serif;
      --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
      --rainbow-grad: linear-gradient(135deg, #FF1E56 0%, #FF5E36 20%, #00F0FF 45%, #FFD000 68%, #7928CA 88%, #5800FF 100%);
      
      /* Dark Theme (Default) */
      --bg-canvas: #050509;
      --bg-stage-grad: radial-gradient(circle at 50% 45%, #141328 0%, #0a0914 50%, #020205 100%);
      --bg-understage: radial-gradient(circle at 50% 50%, #141328 0%, #0a0914 60%, #020205 100%);
      --text-main: #FFFFFF;
      --text-sub: #94A3B8;
      --mesh-opacity: 0.42;
      --vignette-grad: radial-gradient(circle at 50% 50%, transparent 35%, rgba(0, 0, 0, 0.92) 100%);
      
      --chrome-fill: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 45%, #CBD5E1 75%, #94A3B8 100%);
      --chrome-glow: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 35px rgba(255, 255, 255, 0.35));
    }

    /* Light Theme */
    @media (prefers-color-scheme: light) {
      :root[data-theme="auto"] {
        --bg-canvas: #F8FAFC;
        --bg-stage-grad: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #F1F5F9 55%, #E2E8F0 100%);
        --bg-understage: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #F8FAFC 60%, #E2E8F0 100%);
        --text-main: #0F172A;
        --text-sub: #64748B;
        --mesh-opacity: 0.45;
        --vignette-grad: radial-gradient(circle at 50% 50%, transparent 45%, rgba(203, 213, 225, 0.7) 100%);
        
        --chrome-fill: linear-gradient(180deg, #090D16 0%, #1E293B 55%, #334155 100%);
        --chrome-glow: drop-shadow(0 14px 32px rgba(15, 23, 42, 0.3)) drop-shadow(0 2px 8px rgba(15, 23, 42, 0.15));
      }
    }

    :root[data-theme="light"] {
      --bg-canvas: #F8FAFC;
      --bg-stage-grad: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #F1F5F9 55%, #E2E8F0 100%);
      --bg-understage: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #F8FAFC 60%, #E2E8F0 100%);
      --text-main: #0F172A;
      --text-sub: #64748B;
      --mesh-opacity: 0.45;
      --vignette-grad: radial-gradient(circle at 50% 50%, transparent 45%, rgba(203, 213, 225, 0.7) 100%);
      
      --chrome-fill: linear-gradient(180deg, #090D16 0%, #1E293B 55%, #334155 100%);
      --chrome-glow: drop-shadow(0 14px 32px rgba(15, 23, 42, 0.3)) drop-shadow(0 2px 8px rgba(15, 23, 42, 0.15));
    }

    :root[data-theme="dark"] {
      --bg-canvas: #050509;
      --bg-stage-grad: radial-gradient(circle at 50% 45%, #141328 0%, #0a0914 50%, #020205 100%);
      --bg-understage: radial-gradient(circle at 50% 50%, #141328 0%, #0a0914 60%, #020205 100%);
      --text-main: #FFFFFF;
      --text-sub: #94A3B8;
      --mesh-opacity: 0.42;
      --vignette-grad: radial-gradient(circle at 50% 50%, transparent 35%, rgba(0, 0, 0, 0.92) 100%);
      
      --chrome-fill: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 45%, #CBD5E1 75%, #94A3B8 100%);
      --chrome-glow: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 35px rgba(255, 255, 255, 0.35));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      font-family: var(--font-grok);
      color: var(--text-main);
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Under-stage workspace */
    .under-stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-understage);
      color: var(--text-sub);
      z-index: 0;
      gap: 18px;
    }
    .under-stage h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    /* Splash Stage Container */
    .grokd-splash-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      background: var(--bg-stage-grad);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      transform-style: preserve-3d;
      overflow: hidden;
      opacity: 1;
      cursor: pointer;
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.65s ease;
    }

    .grokd-splash-stage.fading-out {
      opacity: 0;
      filter: blur(20px);
      pointer-events: none;
    }

    /* Ambient dynamic background lighting aura */
    .splash-ambient-mesh {
      position: absolute;
      inset: -25%;
      width: 150%;
      height: 150%;
      background: 
        radial-gradient(circle at 30% 30%, rgba(255, 30, 86, var(--mesh-opacity)) 0%, transparent 45%),
        radial-gradient(circle at 70% 25%, rgba(0, 240, 255, var(--mesh-opacity)) 0%, transparent 45%),
        radial-gradient(circle at 65% 75%, rgba(121, 40, 202, var(--mesh-opacity)) 0%, transparent 50%),
        radial-gradient(circle at 25% 70%, rgba(255, 208, 0, var(--mesh-opacity)) 0%, transparent 45%);
      filter: blur(80px);
      pointer-events: none;
      animation: meshDrift 18s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes meshDrift {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.12) rotate(4deg) translate(-2%, 2%); }
      100% { transform: scale(1.04) rotate(-3deg) translate(2%, -1%); }
    }

    .splash-vignette {
      position: absolute;
      inset: 0;
      background: var(--vignette-grad);
      pointer-events: none;
      z-index: 2;
    }

    /* Particle Canvas */
    #particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    /* ==========================================
       Phase 1: Full-Window Edge-to-Edge Echo Swarm
       ========================================== */
    .echo-swarm-layer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 4;
      transform-style: preserve-3d;
      overflow: hidden;
    }

    .echo-clone {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--size, 68px);
      height: var(--size, 68px);
      margin-top: calc(var(--size, 68px) * -0.5);
      margin-left: calc(var(--size, 68px) * -0.5);
      will-change: transform, opacity;
      animation: echoBurst var(--duration, 1.4s) cubic-bezier(0.12, 0.85, 0.25, 1) both;
      animation-delay: var(--delay, 0s);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.45));
    }

    .echo-clone svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes echoBurst {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, -350px) scale(0.06) rotate(var(--rot-start, 0deg));
        filter: brightness(2.6) blur(6px);
      }
      16% {
        opacity: var(--peak-opacity, 0.95);
        filter: brightness(1.2) blur(0px);
      }
      74% {
        opacity: var(--peak-opacity, 0.95);
        transform: translate3d(var(--tx, 100px), var(--ty, 100px), var(--tz, 0px)) scale(var(--target-scale, 1)) rotate(var(--rot-mid, 15deg));
      }
      88% {
        opacity: 0.5;
        transform: translate3d(calc(var(--tx, 100px) * 0.3), calc(var(--ty, 100px) * 0.3), 80px) scale(calc(var(--target-scale, 1) * 0.5)) rotate(var(--rot-end, 30deg));
      }
      100% {
        opacity: 0;
        transform: translate3d(0, 0, 180px) scale(0.04) rotate(calc(var(--rot-end, 30deg) + 45deg));
        filter: brightness(3) blur(8px);
      }
    }

    /* ==========================================
       Phase 2: Hero Mascot (FREE FLOATING HEAD WITH SVG FACE TATTOOS)
       ========================================== */
    .hero-mascot-wrapper {
      position: relative;
      width: 175px;
      height: 175px;
      margin-bottom: 0px;
      transform: scale(0);
      opacity: 0;
      transform-origin: 50% 90%;
      will-change: transform, opacity;
      z-index: 15;
    }

    .hero-mascot-wrapper.active,
    .hero-mascot-wrapper.mascot-bowing,
    .hero-mascot-wrapper.head-wobble {
      opacity: 1 !important;
    }

    .hero-mascot-wrapper.active {
      animation: heroArrive 0.95s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes heroArrive {
      0% {
        opacity: 0;
        transform: scale(0.1) rotate(-15deg) translateZ(-350px);
        filter: brightness(2.8) blur(12px);
      }
      50% {
        opacity: 1;
        filter: brightness(1.2) blur(0px);
      }
      75% {
        transform: scale(1.15) rotate(3deg) translateZ(40px);
      }
      90% {
        transform: scale(0.96) rotate(-1deg) translateZ(0);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg) translateZ(0);
        filter: brightness(1) blur(0px);
      }
    }

    /* Elegant Theatrical Bow to Grok */
    .hero-mascot-wrapper.mascot-bowing {
      animation: mascotBowToGrok 1.1s cubic-bezier(0.35, 0, 0.25, 1) forwards;
    }

    @keyframes mascotBowToGrok {
      0% {
        transform: scale(1) rotate(0deg) translateY(0);
      }
      35% {
        transform: scale(0.92) rotate(-18deg) translateY(24px) skewX(-10deg);
      }
      70% {
        transform: scale(0.90) rotate(-20deg) translateY(28px) skewX(-12deg);
      }
      100% {
        transform: scale(1) rotate(0deg) translateY(0);
      }
    }

    .mascot-ambient-aura {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.45) 0%, rgba(255, 30, 86, 0.4) 45%, rgba(121, 40, 202, 0.4) 70%, transparent 100%);
      filter: blur(28px);
      opacity: 0.85;
      animation: pulseAura 3s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes pulseAura {
      0% { opacity: 0.65; filter: blur(22px); transform: scale(0.95); }
      100% { opacity: 0.98; filter: blur(36px); transform: scale(1.08); }
    }

    /* Mascot Character Head (No Squircle Box) */
    .mascot-creature-head {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1);
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.35));
    }

    .mascot-creature-head svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hero-mascot-wrapper.head-wobble {
      animation: mascotHeadWobble 0.85s ease-in-out;
    }

    @keyframes mascotHeadWobble {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.06) rotate(-8deg) translateY(-10px); }
      50% { transform: scale(1.03) rotate(6deg) translateY(-3px); }
      75% { transform: scale(0.98) rotate(-2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Eye movements & Adorable Natural Wink */
    .eye-group {
      transform-origin: 260px 250px;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .eyes-look-left #left-eye-group, .eyes-look-left #right-eye-group {
      transform: translate(-15px, -6px) rotate(-8deg);
    }

    .eyes-look-right #left-eye-group, .eyes-look-right #right-eye-group {
      transform: translate(14px, 8px) rotate(10deg);
    }

    .eyes-cross #left-eye-group {
      transform: translate(18px, 4px) scale(0.85) rotate(20deg);
    }
    .eyes-cross #right-eye-group {
      transform: translate(-20px, 6px) scale(1.18) rotate(-22deg);
    }

    .eyes-wink #left-eye-open {
      display: none;
    }
    .eyes-wink #left-eye-wink-arc {
      display: block !important;
      stroke-dasharray: 100;
      animation: winkArcDraw 0.25s ease-out forwards;
    }

    @keyframes winkArcDraw {
      0% { opacity: 0; stroke-dashoffset: 50; }
      100% { opacity: 1; stroke-dashoffset: 0; }
    }

    .eyes-wink #right-eye-group {
      transform: scale(1.24) rotate(6deg) translateY(-2px);
    }

    /* Wink Sparkle Star Pop */
    .wink-star-sparkle {
      position: absolute;
      top: 30%;
      left: 20%;
      width: 58px;
      height: 58px;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transform: scale(0) rotate(0deg);
    }

    .wink-star-sparkle.pop {
      animation: starBurst 0.7s cubic-bezier(0.15, 0.9, 0.34, 1.2) forwards;
    }

    @keyframes starBurst {
      0% { opacity: 0; transform: scale(0.1) rotate(0deg); }
      35% { opacity: 1; transform: scale(1.6) rotate(70deg); }
      70% { opacity: 0.95; transform: scale(1.15) rotate(120deg); }
      100% { opacity: 0; transform: scale(0.4) rotate(180deg); }
    }

    /* ==========================================
       Phase 4 & 5: MASSIVE Authentic Typography Stage
       (ZERO CLIPPING / FULL PADDING ON ALL EDGES)
    /* ==========================================
       Phase 3: MASSIVE AUTHENTIC TYPOGRAPHY
       ========================================== */
    .logo-typography-stage {
      position: relative;
      display: flex;
      align-items: baseline;
      justify-content: center;
      width: 98vw;
      max-width: 1500px;
      transform-style: preserve-3d;
      overflow: visible;
      z-index: 20;
      padding: 40px 60px 80px 60px;
      margin-top: -10px;
    }

    /* "grok" Typography Slam */
    .grok-wordmark-wrapper {
      position: relative;
      display: inline-block;
      opacity: 0;
      transform: scale(3.6) translateY(-280px) rotate(-32deg) translateZ(200px);
      will-change: transform, opacity;
      overflow: visible;
      padding: 20px 20px 40px 20px;
    }

    .grok-wordmark-wrapper.slammed {
      animation: grokWordmarkSlam 0.6s cubic-bezier(0.12, 0.95, 0.25, 1) forwards;
    }

    @keyframes grokWordmarkSlam {
      0% {
        opacity: 0;
        transform: scale(3.8) translateY(-320px) rotate(-30deg) translateZ(250px);
        filter: blur(16px) brightness(2.5);
      }
      60% {
        opacity: 1;
        transform: scale(0.92) translateY(10px) rotate(-10deg) translateZ(0);
        filter: blur(0px) brightness(1.25);
      }
      80% {
        transform: scale(1.04) translateY(-4px) rotate(-8deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(-9.5deg);
        filter: blur(0px) brightness(1);
      }
    }

    .grok-text {
      font-family: var(--font-grok);
      font-size: clamp(100px, 16vw, 220px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.055em;
      text-transform: lowercase;
      background: var(--chrome-fill);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: var(--chrome-glow);
      display: inline-block;
      position: relative;
      padding-bottom: 20px;
    }

    /* Raised "“D”" Hanging Typography */
    .d-hang-wrapper {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      margin-left: clamp(8px, 1.5vw, 24px);
      margin-top: clamp(-45px, -5vw, -80px);
      opacity: 0;
      transform-origin: 28px 32px;
      will-change: transform, opacity;
      cursor: grab;
      overflow: visible;
      padding: 20px 30px 40px 10px;
    }

    .d-hang-wrapper:active {
      cursor: grabbing;
    }

    .d-hang-wrapper.d-slammed,
    .d-hang-wrapper.d-shivering,
    .d-hang-wrapper.d-idle-hang {
      opacity: 1 !important;
    }

    .d-hang-wrapper.d-slammed {
      animation: dHangSlam 2.6s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes dHangSlam {
      0% {
        opacity: 0;
        transform: scale(4.5) translate3d(280px, -350px, 350px) rotate(48deg);
        filter: blur(18px) brightness(3);
      }
      15% {
        opacity: 1;
        transform: scale(0.95) translate3d(0, 0, 0) rotate(5deg);
        filter: blur(0px) brightness(1.6);
      }
      22% {
        transform: translate3d(-6px, -4px, 0) rotate(-6deg) skewX(14deg);
        filter: drop-shadow(-6px 0 0 rgba(255,255,255,0.7)) drop-shadow(6px 0 0 rgba(0,240,255,0.7));
      }
      28% {
        transform: translate3d(6px, 5px, 0) rotate(16deg) skewX(-10deg);
      }
      34% {
        transform: translate3d(-4px, 2px, 0) rotate(-2deg) skewX(4deg);
      }
      45% {
        transform: rotate(44deg) translateY(6px);
      }
      58% {
        transform: rotate(-24deg) translateY(4px);
      }
      70% {
        transform: rotate(28deg) translateY(5px);
      }
      80% {
        transform: rotate(-14deg) translateY(4px);
      }
      88% {
        transform: rotate(18deg) translateY(5px);
      }
      94% {
        transform: rotate(6deg) translateY(5px);
      }
      100% {
        opacity: 1;
        transform: rotate(15deg) translateY(5px);
      }
    }

    /* VIOLENT SHIVER / TREMOR (FLINGS LOGOS OFF INTO ORBIT) */
    .d-hang-wrapper.d-shivering {
      animation: dViolentShiver 0.85s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
    }

    @keyframes dViolentShiver {
      0%, 100% { transform: rotate(15deg) translateY(5px); }
      8%  { transform: rotate(26deg) translate(14px, -10px) skewX(18deg) scale(1.12); filter: brightness(2) drop-shadow(0 0 24px #00F0FF); }
      16% { transform: rotate(4deg) translate(-16px, 12px) skewX(-20deg) scale(0.92); filter: brightness(1.8) drop-shadow(0 0 24px #FF1E56); }
      24% { transform: rotate(30deg) translate(18px, -12px) skewX(22deg) scale(1.15); filter: brightness(2.2) drop-shadow(0 0 28px #FFD000); }
      32% { transform: rotate(2deg) translate(-18px, 14px) skewX(-22deg) scale(0.90); }
      40% { transform: rotate(28deg) translate(16px, -10px) skewX(18deg) scale(1.10); filter: brightness(1.9); }
      50% { transform: rotate(6deg) translate(-14px, 10px) skewX(-16deg); }
      60% { transform: rotate(22deg) translate(12px, -8px) skewX(12deg); }
      70% { transform: rotate(8deg) translate(-10px, 6px); }
      80% { transform: rotate(19deg) translate(6px, -4px); }
      90% { transform: rotate(13deg) translate(-2px, 2px); }
    }

    .d-hang-wrapper.d-idle-hang {
      animation: dIdleBreeze 5s ease-in-out infinite alternate;
    }

    @keyframes dIdleBreeze {
      0% { transform: rotate(15deg) translateY(5px); }
      35% { transform: rotate(18.5deg) translateY(5.5px); }
      48% { transform: rotate(19.5deg) translateY(5.5px) skewX(3deg); }
      50% { transform: rotate(18deg) translateY(5px); }
      75% { transform: rotate(11.5deg) translateY(4.5px); }
      100% { transform: rotate(16deg) translateY(5px); }
    }

    .d-quote-glyph {
      font-family: var(--font-grok);
      font-size: clamp(80px, 12vw, 160px);
      font-weight: 900;
      line-height: 1;
      background: var(--chrome-fill);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: var(--chrome-glow);
      display: inline-block;
      transform: translateY(-16px);
      opacity: 0.92;
    }

    .d-glyph-container {
      position: relative;
      display: inline-block;
    }

    .d-glyph-text {
      font-family: var(--font-grok);
      font-size: clamp(110px, 18vw, 230px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--chrome-fill);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: var(--chrome-glow);
      display: inline-block;
      position: relative;
    }

    /* ==========================================
       ULTRA-THIN HAIRLINE / WIREFRAME PROVIDER SVGs
       (Razor-Thin Delicate Micro-Lines, No Chunky Fills)
       ========================================== */
    .naked-stud-svg {
      position: absolute;
      width: clamp(20px, 3.2vw, 34px);
      height: clamp(20px, 3.2vw, 34px);
      display: block;
      z-index: 25;
      pointer-events: none;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.7));
      transition: opacity 0.3s;
    }

    .naked-stud-svg path,
    .naked-stud-svg circle,
    .naked-stud-svg line {
      stroke-width: 1.35px !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
    }

    /* Positioned delicately across the spine & curve of "D" */
    .nstud-claude   { top: 12%; left: 16%; }
    .nstud-openai   { top: 40%; left: 18%; }
    .nstud-gemini   { top: 68%; left: 16%; }
    .nstud-meta     { top: 18%; left: 54%; }
    .nstud-deepseek { top: 46%; left: 66%; }
    .nstud-kimi     { top: 72%; left: 52%; }

    /* Fly-off trajectories */
    .naked-stud-svg.flung-off-1 { animation: shiveredOff1 1.3s cubic-bezier(0.12, 0.9, 0.25, 1) forwards; }
    .naked-stud-svg.flung-off-2 { animation: shiveredOff2 1.2s cubic-bezier(0.12, 0.9, 0.25, 1) forwards; }
    .naked-stud-svg.flung-off-3 { animation: shiveredOff3 1.4s cubic-bezier(0.12, 0.9, 0.25, 1) forwards; }
    .naked-stud-svg.flung-off-4 { animation: shiveredOff4 1.25s cubic-bezier(0.12, 0.9, 0.25, 1) forwards; }
    .naked-stud-svg.flung-off-5 { animation: shiveredOff5 1.45s cubic-bezier(0.12, 0.9, 0.25, 1) forwards; }
    .naked-stud-svg.flung-off-6 { animation: shiveredOff6 1.35s cubic-bezier(0.12, 0.9, 0.25, 1) forwards; }

    @keyframes shiveredOff1 {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
      15% { transform: scale(1.5) translate(-40px, -60px) rotate(160deg); filter: brightness(2); }
      100% { transform: scale(0.1) translate(-850px, -550px) rotate(1080deg); opacity: 0; filter: blur(12px); }
    }
    @keyframes shiveredOff2 {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
      15% { transform: scale(1.6) translate(-60px, 40px) rotate(-200deg); filter: brightness(2); }
      100% { transform: scale(0.1) translate(-950px, 350px) rotate(-1260deg); opacity: 0; filter: blur(12px); }
    }
    @keyframes shiveredOff3 {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
      15% { transform: scale(1.4) translate(30px, 80px) rotate(240deg); filter: brightness(2); }
      100% { transform: scale(0.1) translate(-450px, 750px) rotate(1440deg); opacity: 0; filter: blur(12px); }
    }
    @keyframes shiveredOff4 {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
      15% { transform: scale(1.7) translate(80px, -80px) rotate(-280deg); filter: brightness(2); }
      100% { transform: scale(0.1) translate(1000px, -650px) rotate(-1620deg); opacity: 0; filter: blur(12px); }

    @keyframes shiveredOff5 {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
      15% { transform: scale(1.6) translate(100px, 30px) rotate(320deg); filter: brightness(2); }
      100% { transform: scale(0.1) translate(1100px, 200px) rotate(1800deg); opacity: 0; filter: blur(12px); }

      0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
      15% { transform: scale(1.5) translate(90px, 90px) rotate(-360deg); filter: brightness(2); }
      100% { transform: scale(0.1) translate(1050px, 680px) rotate(-1980deg); opacity: 0; filter: blur(12px); }
    }

    .d-hinge-pin {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #E2E8F0 50%, #94A3B8 100%);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.95), 0 0 5px #FFFFFF;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 30;
    }

    .d-hang-wrapper.d-slammed .d-hinge-pin {
      opacity: 0.98;
    }

    /* Screen Shakes */
    .stage-shake { animation: screenShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes screenShake {
      10%, 90% { transform: translate3d(-4px, 3px, 0); }
      20%, 80% { transform: translate3d(5px, -4px, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 5px, 0); }
      40%, 60% { transform: translate3d(7px, -5px, 0); }
    }

    .stage-shake-heavy { animation: screenShakeHeavy 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes screenShakeHeavy {
      10%, 90% { transform: translate3d(-8px, 6px, 0) scale(1.015); }
      20%, 80% { transform: translate3d(10px, -8px, 0); }
      30%, 50%, 70% { transform: translate3d(-14px, 10px, 0) scale(0.985); }
      40%, 60% { transform: translate3d(12px, -10px, 0); }
    }

    /* Casino slot reel styling for the 2 live plasma orbs */
    .plasma-casino-reel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      border-radius: inherit;
    }

    .plasma-casino-track {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .plasma-casino-item {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .plasma-casino-item svg {
      width: 22px;
      height: 22px;
      display: block;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.8));
    }

    @media (max-width: 768px) {
      .hero-mascot-wrapper { width: 130px; height: 130px; }
      .grok-text { font-size: 80px; }
      .d-glyph-text { font-size: 90px; }
      .d-quote-glyph { font-size: 64px; }
    }

          this.masterGain.connect(this.ctx.destination);

      }
      resume() {

      playSlotSpinTick() {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        const click = this.ctx.createOscillator();
        const cGain = this.ctx.createGain();
        click.type = "sine";
        click.frequency.setValueAtTime(800 + Math.random() * 400, t);
        click.frequency.exponentialRampToValueAtTime(300, t + 0.02);
        cGain.gain.setValueAtTime(0.08, t);
        cGain.gain.exponentialRampToValueAtTime(0.001, t + 0.025);

      playJackpotChime() {

          osc.type = "sine";

          g.gain.linearRampToValueAtTime(0.12, t + i * 0.06 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 0.4);

          g.connect(this.masterGain);
          osc.start(t + i * 0.06);
          osc.stop(t + i * 0.06 + 0.45);

      playEchoWhoosh(index = 0, total = 30) {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98];
        const freq = scale[index % scale.length] * (1 + (index / total) * 0.4);
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq * 0.85, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.25, t + 0.38);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.04, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + 0.42);

      playHeroRise() {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = "triangle";
        sub.frequency.setValueAtTime(55, t);
        sub.frequency.exponentialRampToValueAtTime(140, t + 0.7);
        sub.frequency.exponentialRampToValueAtTime(65, t + 1.2);
        subGain.gain.setValueAtTime(0.001, t);
        subGain.gain.linearRampToValueAtTime(0.3, t + 0.45);
        subGain.gain.exponentialRampToValueAtTime(0.001, t + 1.25);
        sub.connect(subGain);
        subGain.connect(this.masterGain);
        sub.start(t);
        sub.stop(t + 1.3);
      }
      playBowChime() {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(660, t + 0.4);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.16, t + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + 0.65);

      playEyeDart() {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(680, t + 0.08);
        osc.frequency.exponentialRampToValueAtTime(400, t + 0.16);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.12, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + 0.2);
      }
      playWink() {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        const pop = this.ctx.createOscillator();
        const popGain = this.ctx.createGain();
        pop.type = "sine";
        pop.frequency.setValueAtTime(520, t);
        pop.frequency.exponentialRampToValueAtTime(1480, t + 0.1);
        popGain.gain.setValueAtTime(0.001, t);
        popGain.gain.linearRampToValueAtTime(0.25, t + 0.02);
        popGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        pop.connect(popGain);
        popGain.connect(this.masterGain);
        pop.start(t);
        pop.stop(t + 0.2);

        [1760, 2217, 2637, 3520].forEach((freq, i) => {
          const chime = this.ctx.createOscillator();
          const cGain = this.ctx.createGain();
          chime.type = "sine";
          chime.frequency.setValueAtTime(freq, t + 0.05 + i * 0.03);
          cGain.gain.setValueAtTime(0.001, t + 0.05 + i * 0.03);
          cGain.gain.linearRampToValueAtTime(0.08, t + 0.07 + i * 0.03);
          cGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35 + i * 0.03);
          chime.connect(cGain);
          cGain.connect(this.masterGain);
          chime.start(t + 0.05 + i * 0.03);
          chime.stop(t + 0.4 + i * 0.03);
        });
      }
      playGrokSlam() {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        const kick = this.ctx.createOscillator();
        const kickGain = this.ctx.createGain();
        kick.type = "sine";
        kick.frequency.setValueAtTime(190, t);
        kick.frequency.exponentialRampToValueAtTime(32, t + 0.35);
        kickGain.gain.setValueAtTime(0.9, t);
        kickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
        kick.connect(kickGain);
        kickGain.connect(this.masterGain);
        kick.start(t);
        kick.stop(t + 0.75);

        const slap = this.ctx.createOscillator();
        const slapGain = this.ctx.createGain();
        slap.type = "sawtooth";
        slap.frequency.setValueAtTime(860, t);
        slap.frequency.exponentialRampToValueAtTime(140, t + 0.15);
        slapGain.gain.setValueAtTime(0.3, t);
        slapGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        slap.connect(slapGain);
        slapGain.connect(this.masterGain);
        slap.start(t);
        slap.stop(t + 0.2);

      playDSlamAndTweak() {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        const strike = this.ctx.createOscillator();
        const sGain = this.ctx.createGain();
        strike.type = "triangle";
        strike.frequency.setValueAtTime(460, t);
        strike.frequency.exponentialRampToValueAtTime(65, t + 0.25);
        sGain.gain.setValueAtTime(0.75, t);
        sGain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        strike.connect(sGain);
        sGain.connect(this.masterGain);
        strike.start(t);
        strike.stop(t + 0.55);
      }
      playShiverTremor() {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const t = this.ctx.currentTime;
        for (let i = 0; i < 18; i++) {
          const oscTime = t + i * 0.04;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = i % 3 === 0 ? "sawtooth" : "square";
          osc.frequency.setValueAtTime(260 + (i * 55) + Math.random() * 90, oscTime);
          osc.frequency.exponentialRampToValueAtTime(110, oscTime + 0.038);
          gain.gain.setValueAtTime(0.18, oscTime);
          gain.gain.exponentialRampToValueAtTime(0.001, oscTime + 0.04);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(oscTime);
          osc.stop(oscTime + 0.042);
        }
      }
    }

    /* ==========================================
       grokD Cinematic Controller Engine
       ========================================== */
    class GrokDSplash {
      constructor(options = {}) {
        this.options = Object.assign({
          autoStart: true,
          onComplete: null,
        }, options);

        this.stage = document.getElementById("grokd-splash-stage");
        this.audio = new SplashAudio();
        this.timeouts = [];
        this.animFrameId = null;
        this.particles = [];
        this.shockwaves = [];
        this.isRunning = false;

        this.canvas = document.getElementById("particle-canvas");
        if (this.canvas) {
          this.ctx = this.canvas.getContext("2d");
          this.resizeCanvas();
          window.addEventListener("resize", () => this.resizeCanvas());
        }

        this.bindEvents();
        this.play();
      }

      isLightMode() {
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      }

      resizeCanvas() {
        if (!this.canvas) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      bindEvents() {
        const unlockAudio = () => {
          this.audio?.init();
          this.audio?.resume();
        };
        window.addEventListener("pointerdown", unlockAudio, { passive: true });
        window.addEventListener("keydown", unlockAudio, { passive: true });

        // Click anywhere to dismiss immediately
        if (this.stage) {
          this.stage.addEventListener("click", () => this.dismiss());
        }
        window.addEventListener("keydown", (e) => {
          if (e.code === "Escape" || e.code === "Space") this.dismiss();
        });
      }

      schedule(fn, delayMs) {
        const id = setTimeout(fn, delayMs);
        this.timeouts.push(id);
        return id;
      }

      clearTimeline() {
        this.timeouts.forEach(clearTimeout);
        this.timeouts = [];
        if (this.animFrameId) cancelAnimationFrame(this.animFrameId);
      }

      play() {
        this.clearTimeline();
        this.resetVisuals();
        this.audio?.init();
        this.startParticleLoop();

        // 1. Edge-to-Edge Echo Swarm (0.0s - 1.0s)
        this.spawnEchoSwarm(85);
        for (let i = 0; i < 24; i++) {
          this.schedule(() => this.audio?.playEchoWhoosh(i, 24), i * 35);
        }

        // Animate the TWO BEAUTIFUL LIVE PLASMA ORBS as Casino Slot Machine Reels!
        this.schedule(() => this.animateTwoLiveOrbsCasino(), 600);

        // 2. Hero Mascot Materializes (1000ms)
        this.schedule(() => {
          const hero = document.getElementById("hero-mascot");
          if (hero) hero.classList.add("active");
          this.audio?.playHeroRise();

          const isLight = this.isLightMode();
          const rect = hero.getBoundingClientRect();
          this.spawnShockwave(rect.left + rect.width / 2, rect.top + rect.height / 2, isLight ? "#7928CA" : "#00F0FF");
          this.spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 45);
        }, 1000);

        // 3. Expressive Eyes & ADORABLE NATURAL WINK (1900ms - 2800ms)
        this.schedule(() => {
          const card = document.getElementById("mascot-card");
          if (card) card.className = "mascot-creature-head eyes-look-left";
          this.audio?.playEyeDart();
        }, 1900);

        this.schedule(() => {
          const card = document.getElementById("mascot-card");
          if (card) card.className = "mascot-creature-head eyes-look-right";
          this.audio?.playEyeDart();
        }, 2200);

        this.schedule(() => {
          const card = document.getElementById("mascot-card");
          const hero = document.getElementById("hero-mascot");
          if (card) card.className = "mascot-creature-head eyes-cross";
          if (hero) hero.classList.add("head-wobble");
          this.audio?.playEyeDart();
        }, 2500);

        this.schedule(() => {
          const card = document.getElementById("mascot-card");
          const sparkle = document.getElementById("wink-sparkle");
          if (card) card.className = "mascot-creature-head eyes-wink";
          if (sparkle) {
            sparkle.setAttribute("class", "wink-star-sparkle pop");
          }
          this.audio?.playWink();

          const cardRect = card.getBoundingClientRect();
          this.spawnBurst(cardRect.left + cardRect.width * 0.35, cardRect.top + cardRect.height * 0.45, 35, "#FFD000");
        }, 2800);

        // 4. Theatrical Bow to Grok (3300ms)
        this.schedule(() => {
          const hero = document.getElementById("hero-mascot");
          if (hero) {
            hero.classList.remove("active", "head-wobble");
            void hero.offsetWidth;
            hero.classList.add("mascot-bowing");
          }
          this.audio?.playBowChime();
        }, 3300);

        // 5. Slap MASSIVE "grok" Wordmark Diagonally (4200ms)
        this.schedule(() => {
          const grokWrap = document.getElementById("grok-wrapper");
          if (grokWrap) grokWrap.classList.add("slammed");
          this.stage?.classList.add("stage-shake");
          this.audio?.playGrokSlam();

          const isLight = this.isLightMode();
          const grokRect = grokWrap.getBoundingClientRect();
          this.spawnShockwave(grokRect.left + grokRect.width / 2, grokRect.top + grokRect.height / 2, isLight ? "#0F172A" : "#FFFFFF");
          this.spawnBurst(grokRect.left + grokRect.width / 2, grokRect.top + grokRect.height / 2, 55, "#FFFFFF");

          setTimeout(() => this.stage?.classList.remove("stage-shake"), 450);
        }, 4200);

        // 6. Slap Raised Studded "D" (5200ms)
        this.schedule(() => {
          const dWrap = document.getElementById("d-wrapper");
          if (dWrap) dWrap.classList.add("d-slammed");
          this.stage?.classList.add("stage-shake-heavy");
          this.audio?.playDSlamAndTweak();

          const dRect = dWrap.getBoundingClientRect();
          this.spawnShockwave(dRect.left + 30, dRect.top + 30, "#FFFFFF");
          this.spawnBurst(dRect.left + 30, dRect.top + 30, 45, "#CBD5E1");

          setTimeout(() => this.stage?.classList.remove("stage-shake-heavy"), 550);
        }, 5200);

        // 7. The "D" Trembles & VIOLENTLY SHIVERS the logos into orbit! (6400ms)
        this.schedule(() => {
          const dWrap = document.getElementById("d-wrapper");
          const card = document.getElementById("mascot-card");

          if (dWrap) {
            dWrap.classList.remove("d-slammed", "d-idle-hang");
            void dWrap.offsetWidth;
            dWrap.classList.add("d-shivering");
          }

          if (card) {
            card.className = "mascot-creature-head eyes-look-right";
          }

          this.audio?.playShiverTremor();

          // Fling the hairline SVG logos off into orbit!
          const studs = [
            { id: "nstud-claude", cls: "flung-off-1" },
            { id: "nstud-openai", cls: "flung-off-2" },
            { id: "nstud-gemini", cls: "flung-off-3" },
            { id: "nstud-meta", cls: "flung-off-4" },
            { id: "nstud-deepseek", cls: "flung-off-5" },
            { id: "nstud-kimi", cls: "flung-off-6" }
          ];

          studs.forEach((item, index) => {
            this.schedule(() => {
              const el = document.getElementById(item.id);
              if (el) el.classList.add(item.cls);
              const rect = el ? el.getBoundingClientRect() : { left: window.innerWidth * 0.6, top: window.innerHeight * 0.5 };
              this.spawnBurst(rect.left + 15, rect.top + 15, 25, "#00F0FF");
            }, 80 + index * 45);
          });

          // Settle and smoothly AUTO-DISMISS splash into real workspace!
          this.schedule(() => {
            if (dWrap) {
              dWrap.classList.remove("d-shivering");
              dWrap.classList.add("d-idle-hang");
            }
            if (card) card.className = "mascot-creature-head";
            
            // Auto dismiss cleanly after presentation completes
            this.schedule(() => this.dismiss(), 1200);
          }, 1100);

        }, 6400);
      }

      animateTwoLiveOrbsCasino() {
        if (typeof window.__grokBotCasinoSpin === "function") {
          window.__grokBotCasinoSpin(this.audio);
          return;
        }
      }

      resetVisuals() {
        const echoLayer = document.getElementById("echo-layer");
        if (echoLayer) echoLayer.innerHTML = "";
        const hero = document.getElementById("hero-mascot");
        if (hero) hero.className = "hero-mascot-wrapper";
        const card = document.getElementById("mascot-card");
        if (card) card.className = "mascot-creature-head";
        const sparkle = document.getElementById("wink-sparkle");
        if (sparkle) sparkle.setAttribute("class", "wink-star-sparkle");
        const grokWrap = document.getElementById("grok-wrapper");
        if (grokWrap) grokWrap.className = "grok-wordmark-wrapper";
        const dWrap = document.getElementById("d-wrapper");
        if (dWrap) {
          dWrap.className = "d-hang-wrapper";
          dWrap.style.transform = "";
        }

        ["nstud-claude", "nstud-openai", "nstud-gemini", "nstud-meta", "nstud-deepseek", "nstud-kimi"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.setAttribute("class", `naked-stud-svg ${id.replace("nstud-", "nstud-")}`);
        });

        this.particles = [];
        this.shockwaves = [];
      }

      spawnEchoSwarm(count = 85) {
        const layer = document.getElementById("echo-layer");
        if (!layer) return;
        layer.innerHTML = "";

        const w = window.innerWidth;
        const h = window.innerHeight;

        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "echo-clone";
          
          el.innerHTML = `
            <svg viewBox="0 0 512 512">
              <path d="M 162 50 L 315 50 L 275 53 L 215 54 L 155 55 L 101 65 L 65 102 L 54 162 L 68 182 L 128 142 L 215 122 L 305 136 L 383 183 L 434 250 L 456 316 L 458 385 L 401 454 L 308 461 L 209 461 L 110 454 L 52 373 L 50 286 L 50 184 L 68 88 L 127 53 Z" fill="#FFFFFF"/>
              <ellipse cx="192" cy="346" rx="28" ry="16" fill="#FF1E56" opacity="0.6"/>
              <ellipse cx="368" cy="330" rx="26" ry="15" fill="#FF1E56" opacity="0.6"/>
              <path d="M 223 223 L 257 240 L 287 284 L 297 312 L 285 332 L 259 335 L 235 309 L 206 267 L 200 255 Z" fill="#1E1D2D"/>
              <path d="M 320 176 L 356 192 L 389 238 L 400 266 L 389 282 L 365 270 L 334 220 L 312 186 Z" fill="#1E1D2D"/>
            </svg>
          `;

          const angle = (i / count) * Math.PI * 2 + (Math.random() * 0.4 - 0.2);
          const spreadFactor = 0.25 + 0.75 * Math.sqrt((i + 1) / count);
          const maxDistX = (w * 0.48) * spreadFactor;
          const maxDistY = (h * 0.48) * spreadFactor;

          const tx = (Math.cos(angle) * maxDistX) + (Math.random() * 80 - 40);
          const ty = (Math.sin(angle) * maxDistY) + (Math.random() * 80 - 40);
          const tz = Math.floor(Math.random() * 320 - 160);

          const sizePx = Math.floor(44 + Math.random() * 46);
          const targetScale = 0.55 + Math.random() * 0.75;
          const delay = (i * 0.01 + Math.random() * 0.06);
          const duration = (1.2 + Math.random() * 0.4);
          const peakOpacity = 0.88 + Math.random() * 0.12;

          el.style.setProperty("--size", `${sizePx}px`);
          el.style.setProperty("--tx", `${tx}px`);
          el.style.setProperty("--ty", `${ty}px`);
          el.style.setProperty("--tz", `${tz}px`);
          el.style.setProperty("--target-scale", targetScale);
          el.style.setProperty("--delay", `${delay}s`);
          el.style.setProperty("--duration", `${duration}s`);
          el.style.setProperty("--peak-opacity", peakOpacity);
          el.style.setProperty("--rot-start", `${Math.random() * 80 - 40}deg`);
          el.style.setProperty("--rot-mid", `${Math.random() * 50 - 25}deg`);
          el.style.setProperty("--rot-end", `${Math.random() * 110 - 55}deg`);

          layer.appendChild(el);
        }
      }

      spawnShockwave(x, y, color = "#00F0FF") {
        this.shockwaves.push({
          x, y,
          radius: 10,
          maxRadius: Math.max(window.innerWidth, window.innerHeight) * 0.48,
          opacity: 0.95,
          color,
          lineWidth: 7,
          growth: 24,
        });
      }

      spawnBurst(x, y, count = 35, color) {
        const isLight = this.isLightMode();
        const palette = isLight
          ? ["#0F172A", "#1E293B", "#334155", "#00F0FF", "#FF1E56", "#FFD000"]
          : ["#FFFFFF", "#E2E8F0", "#94A3B8", "#00F0FF", "#FF1E56", "#FFD000"];

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (4 + Math.random() * 14);
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 6,
            color: color || palette[Math.floor(Math.random() * palette.length)],
            alpha: 1,
            decay: 0.018 + Math.random() * 0.02,
            gravity: 0.22,
            friction: 0.96,
          });
        }
      }

      startParticleLoop() {
        if (this.isRunning) return;
        this.isRunning = true;

        const loop = () => {
          if (!this.isRunning || !this.ctx) return;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          for (let i = this.shockwaves.length - 1; i >= 0; i--) {
            const sw = this.shockwaves[i];
            sw.radius += sw.growth;
            sw.opacity -= 0.032;
            sw.lineWidth = Math.max(1, sw.lineWidth * 0.95);

            if (sw.opacity <= 0 || sw.radius >= sw.maxRadius) {
              this.shockwaves.splice(i, 1);
              continue;
            }

            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
            this.ctx.strokeStyle = sw.color;
            this.ctx.lineWidth = sw.lineWidth;
            this.ctx.globalAlpha = Math.max(0, sw.opacity);
            this.ctx.shadowBlur = 20;
            this.ctx.shadowColor = sw.color;
            this.ctx.stroke();
            this.ctx.restore();
          }

          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.vx *= p.friction;
            p.vy *= p.friction;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
              this.particles.splice(i, 1);
              continue;
            }

            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = Math.max(0, p.alpha);
            this.ctx.shadowBlur = 12;
            this.ctx.shadowColor = p.color;
            this.ctx.fill();
            this.ctx.restore();
          }

          this.animFrameId = requestAnimationFrame(loop);
        };
        loop();
      }

      dismiss() {
        if (this.stage) {
          this.stage.classList.add("fading-out");
          setTimeout(() => {
            this.clearTimeline();
            this.isRunning = false;
            try { this.stage.remove(); } catch(e) {}
          }, 650);
        }
      }
    }

    // Auto-instantiate on load
    let splashInstance = new GrokDSplash();
  </script>
</body>
