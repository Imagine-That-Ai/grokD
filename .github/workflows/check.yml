name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit door
        run: |
          node test-unit.js
          node test-profiles.js
          node test-box-state.js
          node test-computer-cover.js
          node test-paths.js
          node test-patch-asar.js
          node test-account-identity.js
          node test-bot-pause.js
          node test-failover.js
          node test-failover-act.js
          node test-onboarding.js
          node test-clone-handoff.js
      - name: no identity leak
        run: |
          python3 - <<'PY'
          import subprocess, sys
          needles = [
              "alberto" + "nunez",
              "alberto" + "@local",
              "alberto" + "-local",
              "Nunez" + "-Garcia",
              "Alberto" + "'s Mac",
              "/Users/" + "alberto" + "nunez",
          ]
          skip = {
              "export-public.sh",
              "PROMPT-npm-openburnbar-proxy.md",
              "test-export-public.js",
              "pack-asar.sh",
              "proxy2.js",
              "profile-auth-preload.js",
              "local-mcp.js",
          }
          proc = subprocess.run(
              ["git", "grep", "-I", "-n", "-e", "."],
              capture_output=True, text=True,
          )
          hits = []
          for line in (proc.stdout or "").splitlines():
              path = line.split(":", 1)[0]
              if path in skip or path.startswith(".git"):
                  continue
              for n in needles:
                  if n in line:
                      hits.append(line)
                      break
          if hits:
              print("identity leak", file=sys.stderr)
              print("\n".join(hits[:50]), file=sys.stderr)
              sys.exit(1)
          PY
