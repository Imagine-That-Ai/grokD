<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="i44_squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Rainbow Mesh Background -->
    <linearGradient id="i44_dreamyRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8777" />
      <stop offset="24%" stop-color="#FFA07A" />
      <stop offset="48%" stop-color="#70E6B6" />
      <stop offset="72%" stop-color="#FDCB6E" />
      <stop offset="88%" stop-color="#8065DF" />
      <stop offset="100%" stop-color="#6C5CE7" />
    </linearGradient>

    <radialGradient id="i44_cyanGlow" cx="65%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#55E6C1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#55E6C1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="i44_peachGlow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FF6B8B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FF6B8B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="i44_amberGlow" cx="92%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FECA57" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FECA57" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="i44_violetGlow" cx="80%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#7451EB" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#7451EB" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="i44_coralGlow" cx="25%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Mascot Porcelain Shading -->
    <linearGradient id="i44_mascotGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFD" />
      <stop offset="100%" stop-color="#E2E9F3" />
    </linearGradient>

    <radialGradient id="i44_mascotHighlight" cx="35%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="i44_blushPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4757" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FF4757" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="i44_eyeGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#1E1D2D" />
      <stop offset="60%" stop-color="#12131F" />
      <stop offset="100%" stop-color="#2B1E38" />
    </linearGradient>

    <!-- Provider Brand Gradients -->
    <linearGradient id="i44_geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B7FFF" />
      <stop offset="50%" stop-color="#635BFF" />
      <stop offset="100%" stop-color="#C837AB" />
    </linearGradient>

    <linearGradient id="i44_openaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10A37F" />
      <stop offset="100%" stop-color="#086F55" />
    </linearGradient>

    <linearGradient id="i44_claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#BD4928" />
    </linearGradient>

    <linearGradient id="i44_metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0081FB" />
      <stop offset="100%" stop-color="#0064E0" />
    </linearGradient>

    <linearGradient id="i44_deepseekGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D61E7" />
      <stop offset="100%" stop-color="#0F44B0" />
    </linearGradient>

    <linearGradient id="i44_xaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131A" />
      <stop offset="100%" stop-color="#2B2E3D" />
    </linearGradient>

    <filter id="i44_tattooInk" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0.4" dy="0.7" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <filter id="i44_mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#180A30" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g clip-path="url(#i44_squircleClip)">
    <!-- Multi-Mesh Background -->
    <rect width="512" height="512" fill="url(#i44_dreamyRainbow)" />
    <rect width="512" height="512" fill="url(#i44_peachGlow)" />
    <rect width="512" height="512" fill="url(#i44_cyanGlow)" />
    <rect width="512" height="512" fill="url(#i44_amberGlow)" />
    <rect width="512" height="512" fill="url(#i44_violetGlow)" />
    <rect width="512" height="512" fill="url(#i44_coralGlow)" />

    <!-- Sparkles -->
    <g fill="#FFFFFF" opacity="0.75">
      <path d="M 82 82 Q 82 95 69 95 Q 82 95 82 108 Q 82 95 95 95 Q 82 95 82 82 Z" />
      <path d="M 432 72 Q 432 83 421 83 Q 432 83 432 94 Q 432 83 443 83 Q 432 83 432 72 Z" opacity="0.9" />
      <circle cx="105" cy="150" r="4" opacity="0.7" />
      <circle cx="425" cy="165" r="4.5" opacity="0.8" />
      <circle cx="68" cy="385" r="3.5" opacity="0.6" />
      <circle cx="448" cy="365" r="4" opacity="0.7" />
    </g>

    <!-- Porcelain Mascot Silhouette -->
    <g filter="url(#i44_mascotShadow)">
      <path d="M 130 180 C 180 110 360 90 415 170 C 465 240 440 375 375 425 C 300 465 170 455 110 395 C 60 335 80 235 130 180 Z M 256 200 C 310 200 350 240 350 290 C 350 340 310 380 256 380 C 202 380 162 340 162 290 C 162 240 202 200 256 200 Z" fill="url(#i44_mascotGrad)" />
      <path d="M 130 180 C 180 110 360 90 415 170 C 465 240 440 375 375 425 C 300 465 170 455 110 395 C 60 335 80 235 130 180 Z M 256 200 C 310 200 350 240 350 290 C 350 340 310 380 256 380 C 202 380 162 340 162 290 C 162 240 202 200 256 200 Z" fill="url(#i44_mascotHighlight)" />
    </g>

    
    <!-- Soft Blush -->
    <ellipse cx="187" cy="310" rx="18" ry="11" fill="url(#i44_blushPink)" />
    <ellipse cx="325" cy="305" rx="18" ry="11" fill="url(#i44_blushPink)" />
    
    
    <!-- Signature GrokD Eyes -->
    <g transform="translate(212, 285) rotate(-24)">
      <rect x="-10" y="-26" width="20" height="52" rx="10" fill="url(#i44_eyeGrad)" />
      <ellipse cx="-3" cy="-13" rx="3.8" ry="6.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-6 -3 -13)" />
      <circle cx="3" cy="12" r="2.2" fill="#FFFFFF" opacity="0.5" />
    </g>
    <g transform="translate(300, 280) rotate(-24)">
      <rect x="-10" y="-26" width="20" height="52" rx="10" fill="url(#i44_eyeGrad)" />
      <ellipse cx="-3" cy="-13" rx="3.8" ry="6.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-6 -3 -13)" />
      <circle cx="3" cy="12" r="2.2" fill="#FFFFFF" opacity="0.5" />
    </g>
    
    
