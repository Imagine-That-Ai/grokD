<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App Icon Boundary Clip -->
    <clipPath id="i21_squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- 3D Mascot Porcelain White Body Shaders -->
    <linearGradient id="i21_mascotGrad" x1="25%" y1="5%" x2="75%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F8FD" />
      <stop offset="100%" stop-color="#DDE7F5" />
    </linearGradient>

    <linearGradient id="i21_mascotGradWarm" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#EBE3D8" />
    </linearGradient>

    <radialGradient id="i21_mascotHighlight" cx="35%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="i21_mascotRimGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#D3E2F4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#B2C9E4" stop-opacity="0" />
    </radialGradient>

    <!-- Pink Cheek Blush -->
    <radialGradient id="i21_blushPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4757" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#FF4757" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF4757" stop-opacity="0" />
    </radialGradient>

    <!-- Glossy Eye Gradient with Deep Violet/Navy Tone -->
    <linearGradient id="i21_eyeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1E1D2D" />
      <stop offset="60%" stop-color="#12131F" />
      <stop offset="100%" stop-color="#2B1E38" />
    </linearGradient>

    <!-- AI Model Provider Brand Gradients -->
    <linearGradient id="i21_geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B7FFF" />
      <stop offset="50%" stop-color="#635BFF" />
      <stop offset="100%" stop-color="#C837AB" />
    </linearGradient>

    <linearGradient id="i21_openaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10A37F" />
      <stop offset="100%" stop-color="#086F55" />
    </linearGradient>

    <linearGradient id="i21_claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#BD4928" />
    </linearGradient>

    <linearGradient id="i21_metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0081FB" />
      <stop offset="100%" stop-color="#0064E0" />
    </linearGradient>

    <linearGradient id="i21_deepseekGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D61E7" />
      <stop offset="100%" stop-color="#0F44B0" />
    </linearGradient>

    <linearGradient id="i21_xaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131A" />
      <stop offset="100%" stop-color="#2B2E3D" />
    </linearGradient>

    <!-- Tattoo Skin Depth Filter -->
    <filter id="i21_tattooInk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.4" dy="0.7" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Mascot Drop Shadow Filter -->
    <filter id="i21_mascotShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0B0920" flood-opacity="0.32" />
    </filter>

    <!-- Background: Amber Golden Harvest Rainbow Mesh -->
    <linearGradient id="i21_bgRainbow21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" />
      <stop offset="28%" stop-color="#FF6B6B" />
      <stop offset="55%" stop-color="#FECA57" />
      <stop offset="78%" stop-color="#1DD1A1" />
      <stop offset="100%" stop-color="#5F27CD" />
    </linearGradient>
    <radialGradient id="i21_glow21a" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FF9FF3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF9FF3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="i21_glow21b" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FECA57" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FECA57" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="i21_glow21c" cx="75%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#54A0FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#54A0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Acorn Cap / Wooden Beret Shader -->
    <linearGradient id="i21_capGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F2F6FA" />
      <stop offset="80%" stop-color="#D4E1F0" />
      <stop offset="100%" stop-color="#BDCDE0" />
    </linearGradient>
    <linearGradient id="i21_stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E3EDF8" />
      <stop offset="100%" stop-color="#BCCFE5" />
    </linearGradient>
  </defs>

  <g clip-path="url(#i21_squircleClip)">
    <!-- Canvas Background -->
    <rect width="512" height="512" fill="url(#i21_bgRainbow21)" />
    <rect width="512" height="512" fill="url(#i21_glow21a)" />
    <rect width="512" height="512" fill="url(#i21_glow21b)" />
    <rect width="512" height="512" fill="url(#i21_glow21c)" />

    <!-- Bokeh & Sparkles -->
    <g fill="#FFFFFF" opacity="0.85">
      <path d="M 70 62 Q 70 75 57 75 Q 70 75 70 88 Q 70 75 83 75 Q 70 75 70 62 Z" opacity="0.9" />
      <path d="M 440 77 Q 440 90 427 90 Q 440 90 440 103 Q 440 90 453 90 Q 440 90 440 77 Z" opacity="0.9" />
      <path d="M 430 412 Q 430 420 422 420 Q 430 420 430 428 Q 430 420 438 420 Q 430 420 430 412 Z" opacity="0.75" />
      <path d="M 90 402 Q 90 410 82 410 Q 90 410 90 418 Q 90 410 98 410 Q 90 410 90 402 Z" opacity="0.75" />
      <circle cx="120" cy="160" r="4" opacity="0.7" />
      <circle cx="415" cy="170" r="4.5" opacity="0.8" />
      <circle cx="256" cy="50" r="3.5" opacity="0.8" />
      <circle cx="395" cy="330" r="3" opacity="0.6" />
      <circle cx="105" cy="290" r="3" opacity="0.6" />
    </g>

    <!-- MASCOT: 3D Porcelain Oak Acorn Nut Mascot -->
    <g filter="url(#i21_mascotShadow)">
      <!-- 1. Acorn Nut Base Belly Body -->
      <path d="M 136 210 C 136 330, 190 435, 256 448 C 322 435, 376 330, 376 210 C 376 195, 136 195, 136 210 Z" fill="url(#i21_mascotGrad)" />
      <!-- Body Highlight Overlay -->
      <path d="M 136 210 C 136 330, 190 435, 256 448 C 322 435, 376 330, 376 210 C 376 195, 136 195, 136 210 Z" fill="url(#i21_mascotHighlight)" />
      <path d="M 136 210 C 136 330, 190 435, 256 448 C 322 435, 376 330, 376 210 C 376 195, 136 195, 136 210 Z" fill="url(#i21_mascotRimGlow)" />
      
      <!-- Subtle nut longitudinal contours -->
      <path d="M 256 220 Q 256 340 256 444" stroke="#D3E0EE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.35" />
      <path d="M 196 220 Q 206 330 248 438" stroke="#D3E0EE" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3" />
      <path d="M 316 220 Q 306 330 264 438" stroke="#D3E0EE" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3" />

      <!-- 2. Acorn Stalk / Stem (Top) -->
      <path d="M 256 120 C 256 75, 282 62, 296 58 C 298 57, 300 60, 298 63 C 286 78, 272 94, 268 120 Z" fill="url(#i21_stemGrad)" stroke="#B8CDE2" stroke-width="1.5" />
      <ellipse cx="296" cy="59" rx="4" ry="2.5" transform="rotate(-25, 296, 59)" fill="#FFFFFF" opacity="0.9" />

      <!-- 3. Acorn Textured Cupule Beret Cap -->
      <path d="M 112 215 C 112 120, 200 110, 256 110 C 312 110, 400 120, 400 215 C 400 232, 380 236, 256 236 C 132 236, 112 232, 112 215 Z" fill="url(#i21_capGrad)" />
      <path d="M 112 215 C 112 120, 200 110, 256 110 C 312 110, 400 120, 400 215 C 400 232, 380 236, 256 236 C 132 236, 112 232, 112 215 Z" fill="url(#i21_mascotHighlight)" />
      
      <!-- Beret Cross-hatch scale texture & stippling -->
      <g stroke="#BACCE0" stroke-width="2.5" stroke-linecap="round" opacity="0.65" fill="none">
        <!-- Curved concentric scale tiers -->
        <path d="M 138 190 Q 256 210 374 190" />
        <path d="M 158 160 Q 256 180 354 160" />
        <path d="M 195 132 Q 256 148 317 132" />
        <!-- Diagonal cross ridges -->
        <path d="M 180 135 Q 210 180 235 230" />
        <path d="M 225 120 Q 250 175 270 234" />
        <path d="M 270 120 Q 290 175 305 230" />
        <path d="M 315 135 Q 330 175 340 220" />
        <path d="M 330 135 Q 300 180 275 230" />
        <path d="M 285 120 Q 260 175 240 234" />
        <path d="M 240 120 Q 220 175 205 230" />
        <path d="M 195 135 Q 180 175 170 220" />
      </g>

      <!-- Stippling dots on cupule texture scales -->
      <g fill="#A8BFD8" opacity="0.75">
        <circle cx="210" cy="142" r="2" />
        <circle cx="256" cy="132" r="2.2" />
        <circle cx="302" cy="142" r="2" />
        <circle cx="175" cy="172" r="2" />
        <circle cx="225" cy="168" r="2.2" />
        <circle cx="285" cy="168" r="2.2" />
        <circle cx="335" cy="172" r="2" />
        <circle cx="150" cy="202" r="2.2" />
        <circle cx="195" cy="202" r="2.4" />
        <circle cx="256" cy="198" r="2.5" />
        <circle cx="315" cy="202" r="2.4" />
        <circle cx="360" cy="202" r="2.2" />
      </g>
      
      <!-- Beret Rim Lip -->
      <ellipse cx="256" cy="224" rx="146" ry="14" fill="#FFFFFF" opacity="0.8" />
      <path d="M 110 222 C 110 238, 402 238, 402 222 C 402 214, 110 214, 110 222 Z" fill="none" stroke="#C5D5E8" stroke-width="2.5" />
    </g>

    <!-- Glowing Pink Cheek Blush Spots -->
    <ellipse cx="176" cy="335" rx="26" ry="16" fill="url(#i21_blushPink)" />
    <ellipse cx="336" cy="335" rx="26" ry="16" fill="url(#i21_blushPink)" />

    <!-- GrokD Signature Diagonal Pill Eyes (-24°) -->
    <!-- Pill Eye (Left) -->
    <g transform="translate(208, 285) rotate(-24)">
      <rect x="-11.0" y="-25.0" width="22" height="50" rx="11.0" fill="url(#i21_eyeGrad)" />
      <!-- Specular Catchlights -->
      <ellipse cx="-2.75" cy="-9.5" rx="4.2" ry="7.0" fill="#FFFFFF" opacity="0.9" />
      <circle cx="3.3" cy="12.0" r="2.75" fill="#FFFFFF" opacity="0.55" />
    </g>

    <!-- Pill Eye (Right) -->
    <g transform="translate(304, 285) rotate(-24)">
      <rect x="-11.0" y="-25.0" width="22" height="50" rx="11.0" fill="url(#i21_eyeGrad)" />
      <!-- Specular Catchlights -->
      <ellipse cx="-2.75" cy="-9.5" rx="4.2" ry="7.0" fill="#FFFFFF" opacity="0.9" />
      <circle cx="3.3" cy="12.0" r="2.75" fill="#FFFFFF" opacity="0.55" />
    </g>

    <!-- AI MODEL PROVIDER TATTOOS -->
    <!-- 1. OpenAI: Beret front crown crest -->
    <g transform="translate(236, 142) scale(0.13)" fill="url(#i21_openaiGrad)" filter="url(#i21_tattooInk)">
